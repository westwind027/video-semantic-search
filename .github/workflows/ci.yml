name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            echo "The following Go files are not formatted with gofmt:"
            printf '%s\n' "${files}"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Build all Go packages
        run: go build -trimpath -buildvcs=false ./...

  python-and-scripts:
    name: Python and shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Parse Python sources
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(
              path
              for root in (Path("python"), Path("scripts"))
              for path in root.rglob("*.py")
          )
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Parsed {len(files)} Python files")
          PY

      - name: Check shell scripts
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "${script}"
          done
